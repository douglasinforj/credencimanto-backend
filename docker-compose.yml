version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: credenciamento-postgres
    environment:
      POSTGRES_DB: credenciamento
      POSTGRES_USER: credenciamento
      POSTGRES_PASSWORD: credenciamento123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credenciamento"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: credenciamento-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: credenciamento-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"          # console web
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data: